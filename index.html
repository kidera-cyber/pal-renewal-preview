<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- レビュー環境では常に最新を表示する（本番化時は削除可） -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>株式会社PAL コーポレートサイト改修｜社内確認用</title>
<link rel="stylesheet" href="assets/css/portal.css?v=20260910o">
<style>
  .build-stamp{margin:0 0 10px;font-size:12px;color:#6B6D81;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .build-stamp b{font-weight:700;color:#262946}
  .build-stamp__btn{
    padding:4px 12px;border:1px solid #C3CBE0;border-radius:9999px;background:#fff;
    font-size:12px;color:#262946;cursor:pointer;font-family:inherit;
  }
  .build-stamp__btn:hover{background:#F2F3F6}
</style>
</head>
<body>

<header class="portal-header" role="banner">
  <div class="portal-header__brand">
    <span class="portal-header__mark">PAL</span>
    <div class="portal-header__names">
      <span class="portal-header__title">株式会社PAL コーポレートサイト改修</span>
      <span class="portal-header__sub">社内レビュー用ポータル</span>
    </div>
  </div>
  <!-- ===== BUILD STAMP v1：レビュアーが新旧を判別できるよう最終更新時刻を表示。
       表示されている時刻が最新でなければ、ブラウザのキャッシュが残っている ===== -->
  <p class="build-stamp">最終更新：<b id="buildStamp">-</b>　<button type="button" id="forceReload" class="build-stamp__btn">最新を再取得</button></p>
  <nav class="portal-tabs" role="tablist" aria-label="ページ切替タブ">
    <button class="portal-tab" role="tab" data-page="home"   aria-selected="true"  aria-controls="previewFrame">ホーム</button>
    <button class="portal-tab" role="tab" data-page="role"   aria-selected="false" aria-controls="previewFrame">私たちの役割</button>
    <button class="portal-tab" role="tab" data-page="reason" aria-selected="false" aria-controls="previewFrame">PALの強み</button>
    <!-- ===== FDE-TAB v2：FDE 専用ページ廃止に伴いタブを撤去。FDE の説明は「私たちの役割」タブ内 ===== -->
    <button class="portal-tab" role="tab" data-page="service" aria-selected="false" aria-controls="previewFrame">サービス一覧</button>
  </nav>
  <div class="portal-header__meta">
    <span class="portal-current">現在表示中：<strong id="currentPageName">ホーム</strong></span>
    <a id="openPage" class="portal-open" href="pages/home.html" target="_blank" rel="noopener noreferrer">新しいタブで開く ↗</a>
  </div>
</header>

<div class="portal-legend" role="note" aria-label="レビュー用マーキングの凡例">
  <span class="portal-legend__item portal-legend__item--changed">今回変更</span>
  <span class="portal-legend__item portal-legend__item--added">新規追加</span>
  <span class="portal-legend__item portal-legend__item--check">要確認</span>
  <span class="portal-legend__item portal-legend__item--pending">内容変更予定</span>
  <span class="portal-legend__note">レビュー用マーキングは各ページ側の <code>body.review-mode</code> により表示。本番化時は各ページから外します。</span>
</div>

<main class="portal-main">
  <iframe
    id="previewFrame"
    class="preview-frame"
    src="pages/home.html"
    title="株式会社PAL コーポレートサイト改修プレビュー"
    role="tabpanel"
  ></iframe>
</main>

<script src="assets/js/portal.js?v=20260910o" defer></script>
</body>
</html>
